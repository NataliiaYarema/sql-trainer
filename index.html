<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL-тренажер для дата-аналітики</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Тренажер SQL для дата-аналітики: 125 завдань на 8 рівнів, справжній PostgreSQL прямо в браузері."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SQL-тренажер для дата-аналітики" />
    <meta
      property="og:description"
      content="125 завдань на 8 рівнів. Запити виконує справжній PostgreSQL у вкладці браузера."
    />
    <meta property="og:url" content="https://sql-trainer-zeta.vercel.app/" />
    <meta property="og:image" content="https://sql-trainer-zeta.vercel.app/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol
        id="i-briefcase"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="2" y="7" width="20" height="14" rx="2" />
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
      </symbol>
      <symbol
        id="i-table"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M3 9h18M3 15h18M9 3v18" />
      </symbol>
      <symbol
        id="i-target"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
        <circle cx="12" cy="12" r="1.5" />
      </symbol>
      <symbol
        id="i-columns"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9" />
        <path d="M3 15h18M12 4v11" />
        <path d="m8 20 4-3 4 3" />
      </symbol>
      <symbol
        id="i-bulb"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 18h6M10 22h4" />
        <path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2Z" />
      </symbol>
      <symbol
        id="i-check"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m20 6-11 11-5-5" />
      </symbol>
      <symbol
        id="i-x"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol
        id="i-flag"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 22V4M4 4h13l-2 4 2 4H4" />
      </symbol>
      <symbol
        id="i-arrow-right"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol
        id="i-arrow-left"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </symbol>
      <symbol
        id="i-play"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 4 14 8-14 8V4Z" />
      </symbol>
      <symbol
        id="i-award"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="9" r="6" />
        <path d="m8.5 14-1.5 8 5-3 5 3-1.5-8" />
      </symbol>
      <symbol
        id="i-book"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
      </symbol>
      <symbol
        id="i-refresh"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
        <path d="M3 21v-5h5" />
      </symbol>
      <symbol
        id="i-database"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <ellipse cx="12" cy="5" rx="8" ry="3" />
        <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />
        <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
      </symbol>
      <symbol
        id="i-note"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
        <path d="M14 2v6h6" />
        <path d="M8 13h8M8 17h5" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo"
            ><svg class="icon"><use href="#i-database" /></svg
          ></span>
          <div>
            <h1 class="topbar__title">SQL-тренажер</h1>
            <p class="topbar__subtitle">Практика SQL-запитів для дата-аналітики в PostgreSQL</p>
          </div>
        </div>
        <div id="progress-root" class="topbar__progress"></div>
      </header>

      <main class="layout" id="layout-root">
        <section class="panel panel--task">
          <div id="task-nav-root"></div>
          <div id="task-card-root"></div>
          <div id="hint-root"></div>
          <div id="theory-root"></div>
        </section>

        <section class="panel panel--work" id="work-panel">
          <div class="editor-block">
            <div class="editor-block__head">
              <span class="section-label"
                ><svg class="icon"><use href="#i-play" /></svg>Ваш SQL-запит</span
              >
              <span class="editor-block__hint">Ctrl + Enter — перевірити</span>
            </div>
            <div id="editor-root" class="editor-host"></div>
          </div>
          <div id="controls-root"></div>
          <div id="feedback-root"></div>
          <div id="result-root"></div>
          <div id="note-root"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
